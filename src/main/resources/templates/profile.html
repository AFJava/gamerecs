<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <link rel = "stylesheet" href = "/css/style.css">
    <title>My GameRecs Profile</title>
</head>

<body>
    <header>
        <div class = "navbar">
            <div class = "logo">
                <img src = "/assets/Logo.png">
            </div>

            <div class = "links">
                <a href = "/" class = "nav-item">Home</a>
                <form th:action = "@{/logout}" method = "post">
                    <button type = "submit" class = "nav-item">Logout</button>
                </form>
            </div>
        </div>
        
        <h1>My Profile</h1>
        
        <div class = "search">
            <div class="filter-container">
                <input type="checkbox" name="filter-obscure" id="filter-obscure" checked>
                <label for="filter-obscure" title="Exclude games added by &lt;100 players">Filter obscure results</label>
            </div>
            
            <div class="searchbar">
                <input type = "text" name = "search" class = "searchbar" placeholder = "Add and rate games you've played to your profile">
                <img src = "/assets/Search Icon.png" class = "search-icon">
            </div>
        </div>
        
        <div class="search-results"></div>
    </header>

    <h1>My Games</h1>

    <div class="added-games">
        <div th:each="game : ${userGames}" class="profile-card">
            <img class="game-preview" th:src="${game.imageSrc}">
            <h2 class="game-name" th:text="${game.name}"></h2>
            <p class="game-rating" th:text="|Rating: ${game.rating} / 10|"></p>
        </div>
    </div>
    <!--CREDIT RAWG API-->

    <footer>
        <p class="rawg-disclaimer">All game data and game images provided by <a href="http://rawg.io" target="_blank">rawg.io</a></p>
    </footer>
</body>

<script th:inline="javascript">
    window.userGamesRawgIds = new Set(/*[[${userGamesRawgIds}]]*/ []);
</script>
<script src="/js/search.js"></script>

</html>
