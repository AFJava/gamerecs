<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "/css/style.css">
    <title>GameRecs</title>
</head>

<body>
    <header class="long-header">
        <div class = "navbar">
            <div class = "logo">
                <img src = "assets/Logo.png">
            </div>

            <div class = "links">
                <a href = "/" class = "nav-item">Home</a>
                <a th:if="${authenticated}" th:href="@{/users/{id}/profile(id=${id})}" class="nav-item">Profile</a>
                <form th:if="${authenticated}" th:action = "@{/logout}" method = "post">
                    <button type = "submit" class = "nav-item">Logout</button>
                </form>
                <a th:if="${! authenticated}" href = "/login" class = "nav-item">Sign Up</a>
                <a th:if="${! authenticated}" href = "/login" class = "nav-item">Login</a>
            </div>
        </div>


        <h1>GameRecs</h1>

        <div class = "summary">
            <p>Get a list of game recommendations based on what games you previously liked/disliked.</p>
            <p><a href = "/login">Log in</a> to find out what game is next for you!</p>
            <p>New to GameRecs? <a href = "/login">Sign Up</a> here!</p>
        </div>
    </header>
</body>
</html>
