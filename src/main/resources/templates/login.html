<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "/style.css">
    <title>GameRecs</title>
</head>



<body>
    <header>
        <div class = "navbar">
            <div class = "logo">
                <img src = "assets/Logo.png">
            </div>

            <div class = "links">
                <a href = "/">Home</a>
                <a href = "/login">Sign Up</a>
                <a href = "/login">Login</a>
            </div>
        </div>
    </header>

    <div class = "login_interface">
        <div class = "login">
            <h1 class = "login_header">Log In</h1>

            <form>
                <input type = "text" id = "email" placeholder = "Email"><br>
                <input type = "text" id = "pass" placeholder = "Password">
            </form>
        </div>

        <div class = "login_divider">
            <p>or</p>
        </div>

        <div class = "signup">
            <h1 class = "login_header">Sign Up</h1>

            <form>
                <input type = "text" id = "email" placeholder = "Email"><br>
                <input type = "text" id = "pass" placeholder = "Password"><br>
                <input type = "text" id = "passRe" placeholder = "Retype Password">
            </form>
        </div>
    </div>
</body>
</html>
