<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name = "_csrf" th:content = "${_csrf.token}">
    <meta name = "_csrf_header" th:content = "${_csrf.headerName}">
    <link rel = "stylesheet" href = "/css/style.css">
    <script src="/js/auth.js"></script>
    <title>GameRecs Login</title>
</head>



<body>
    <header>
        <div class = "navbar">
            <div class = "logo">
                <img src = "assets/Logo.png">
            </div>

            <div class = "links">
                <a href = "/">Home</a>
                <a href = "/login">Sign Up</a>
                <a href = "/login">Login</a>
            </div>
        </div>
    </header>

    <div class = "login_interface">
        <div class = "login">
            <h1>Log In</h1>

            <form>
                <input type = "text" id = "emailAuth" placeholder = "Email" name = "username"><br>
                <input type = "text" id = "passwordAuth" placeholder = "Password" name = "password"><br>
                <button type = "submit" id = "login">Log In</button>
            </form>
        </div>

        <div class = "login_divider">
            <p>or</p>
        </div>

        <div class = "signup">
            <h1>Sign Up</h1>

            <form>
                <input type = "text" id = "email" placeholder = "Email"><br>
                <input type = "text" id = "password" placeholder = "Password"><br>
                <input type = "text" id = "retype" placeholder = "Retype Password"><br>
                <button type = "submit" id = "signup">Create Account</button>
            </form>

            <p id = "signuperr" th:text = "${signuperr}"></p>
        </div>
    </div>
</body>
</html>
